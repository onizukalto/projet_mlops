stages:
  - train
  - build

# Job 1 : entraînement + quality gate
train:
  stage: train
  image: python:3.14-slim
  script:
    - pip install --no-cache-dir -r requirements.txt
    - python train.py
  artifacts:
    paths:
      - model_export/
    expire_in: 1 week

# Job 2 : construire l'image et vérifier qu'elle répond
build_and_test:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build -t iris-api .
    - docker run -d -p 8000:8000 --name api iris-api
    - sleep 20
    - apk add --no-cache curl
    - >
      curl -sf -X POST http://docker:8000/predict
      -H "Content-Type: application/json"
      -d '[5.1, 3.5, 1.4, 0.2]'
      | grep setosa